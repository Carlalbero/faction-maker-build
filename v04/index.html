ina (viste laterali)",leg_l:"gamba sinistra a schermo (viste fronte/retro)",leg_r:"gamba destra a schermo (viste fronte/retro)",torso:"corpo + armatura del busto + tabarda",shoulder_l:"spallaccio sinistro a schermo",shoulder_r:"spallaccio destro a schermo",shoulder:"spallaccio vicino (viste laterali)",arm_main:"avambraccio del braccio della lancia (solo vista destra)",hand_main:"mano che impugna la lancia (sempre sopra l asta)",face:"pelle/viso (sotto l elmo, gruppo head)",helmet:"elmo (sopra il viso, gruppo head) - sostituibile"}},anchorsFormat:"anchors are in 56x56 CELL coordinates (same space as pivot; subtract offX/offY for trimmed-rect coords). head{x,y,rot}: centre of face+helmet, rot = degrees the frame was rotated (CCW positive, death only). hand_main{x,y,angle,grip}: spear hand; when grip=true (x,y) is the grip point on the shaft and angle is the shaft angle in degrees (0 = pointing right, 90 = tip up, screen y down); grip=false (death after release) -> angle null. weapon{butt:[x,y],tip:[x,y],angle}: weapon axis (may extend past the cell where the spear is clipped). hand_off{x,y,rot}: centre of the shield layer (null when no shield is carried). torso{x,y,rot}: centre of torso layer. Death frames 2+ are rotated: anchors are rotated with them.",equipment:{helmet:"base",shield:"rinforzato",weapon:"spear"},changes:["proto-2.1: death 4 -> 8 frames per direction, durations [100,130,110,80,60,70,90,700] ms (eased); idle/walk/attack frame counts and durations unchanged.","proto-2.1: new optional per-frame fields anchors + layers, new meta.layers/anchorsFormat/equipment/changes. All proto-2 fields kept.","proto-2.1: right view draws the forearm after the spear (hand/forearm always over the shaft).","proto-2.2: front (down) and back (up) views: the shaft is drawn IN FRONT of the spear-arm pauldron and under the fist (fist wraps the shaft, shaft visible above and below it); attack down/up thrusts show the butt behind the fist (Carl feedback 2026-11-02).","proto-2.1: w
